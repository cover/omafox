name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    container:
      image: alpine:3.24
    timeout-minutes: 10

    steps:
      - name: Install test dependencies
        run: apk add --no-cache bash build-base git nodejs python3 shellcheck

      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run all tests
        run: ./tests/run.sh
